name: SatSort Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Qt6 & Linux system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            xvfb libxkbcommon-x11-0 libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 wget file desktop-file-utils dpkg-dev

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          xvfb-run python3 -m unittest discover tests

      - name: Extract Changelog for Current Version
        run: |
          python3 -c "
          import re, os
          tag = os.environ.get('TAG_NAME', '')
          ver = tag.lstrip('v')
          changelog_path = 'CHANGELOG.md'
          notes = f'Release {tag}'
          if os.path.exists(changelog_path):
              with open(changelog_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s*\[(?:v)?{re.escape(ver)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
          
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          "
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Build Standalone Binary & .deb Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Build AppImage Package
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Extract appimagetool (runs cleanly in Docker/CI environment without FUSE)
          ./appimagetool-x86_64.AppImage --appimage-extract
          
          # Prepare AppDir
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/mime/packages
          
          cp dist/satsort AppDir/usr/bin/satsort
          chmod +x AppDir/usr/bin/satsort
          
          sed "s|Exec=.*|Exec=satsort %f|g" satsort.desktop > AppDir/satsort.desktop
          cp assets/satsort.svg AppDir/satsort.svg
          cp assets/satsort.svg AppDir/usr/share/icons/hicolor/scalable/apps/satsort.svg
          cp assets/satsort.svg AppDir/.DirIcon
          cp satsort-mime.xml AppDir/usr/share/mime/packages/satsort.xml
          
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS}"
          exec "${HERE}/usr/bin/satsort" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          mkdir -p release_output
          VER="${TAG_NAME:-1.0.1}"
          VER="${VER#v}"
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "release_output/SatSort-${VER}-x86_64.AppImage"
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Prepare Standalone Binary Deliverable
        run: |
          cp dist/satsort release_output/satsort-linux-x86_64
          chmod +x release_output/satsort-linux-x86_64

      - name: Build Static APT Repository
        run: |
          python3 scripts/build_apt_repo.py release_output apt_repo_out

      - name: Deploy APT Repository to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt_repo_out
          publish_branch: gh-pages
          keep_files: false
          commit_message: "deploy: publish APT repository for ${{ github.ref_name }}"

      - name: List Release Deliverables
        run: |
          ls -lah release_output/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SatSort ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release_output/*.AppImage
            release_output/*.deb
            release_output/satsort-linux-x86_64
