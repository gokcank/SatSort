[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satsort"
version = "1.0.1"
description = "Modern Linux Native SatcoDX Channel List Editor"
readme = "README.md"
authors = [
    { name = "Gökcan", email = "gokcan@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["satellite", "channels", "sdx", "satcodx", "tv", "radio", "editor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.4.0",
]

[project.urls]
Homepage = "https://github.com/gokcank/SatSort"
Issues = "https://github.com/gokcank/SatSort/issues"

[project.scripts]
satsort = "main:main"

[tool.setuptools.package-data]
"*" = ["*.json", "*.svg", "*.xml", "*.desktop"]


[tool.setuptools.packages.find]
where = ["."]
include = ["satsort*", "assets*"]
